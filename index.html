<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listas por Setores</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="app">
  <h1>Minhas listas por setores</h1>

  <form id="itemForm" class="panel">
    <div class="field">
      <label for="itemName" class="big">Item:</label>
      <input type="text" id="itemName" class="big" maxlength="80" placeholder="Ex.: Ibuprofeno, Arroz, Caneta" required>
    </div>
    <div class="row">
      <div class="field grow">
        <label for="itemSector">Setor:</label>
        <select id="itemSector" required></select>
      </div>
      <div class="field qty">
        <label for="itemQty">Qtd.</label>
        <input type="number" id="itemQty" min="1" max="9999" inputmode="numeric" placeholder="0">
      </div>
      <div class="field grow">
        <label for="itemUnit">Unidade / Tipo:</label>
        <select id="itemUnit"></select>
      </div>
      <div class="field grow colorfield">
        <label for="colorBtn">Cor:</label>
        <button type="button" id="colorBtn" class="colorbtn" aria-haspopup="listbox" aria-expanded="false"><span id="colorDot" class="dot"></span><span>▾</span></button>
        <div id="colorList" class="colorlist" role="listbox" aria-label="Cores" hidden></div>
      </div>
    </div>
    <div class="field">
      <label for="itemNotes">Observações:</label>
      <textarea id="itemNotes" rows="4" maxlength="500" placeholder="Marca, tamanho, onde comprar..."></textarea>
    </div>
    <div class="row">
      <button type="submit" id="submitBtn" class="btn primary">Adicionar item</button>
      <button type="button" id="cancelEdit" class="btn" hidden>Cancelar edição</button>
    </div>
  </form>

  <div class="toolbar">
    <input type="search" id="filter" placeholder="Filtrar itens..." aria-label="Filtrar itens">
    <button type="button" id="newSector" class="btn">+ Setor</button>
    <button type="button" id="exportBtn" class="btn">Exportar</button>
    <button type="button" id="importBtn" class="btn">Importar</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>

  <div id="sectors" class="sectors"></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <input type="text" id="dlgName" maxlength="30" required>
    <div id="dlgIcons" class="icons" hidden></div>
    <label id="dlgColorLabel" hidden>Cor: <input type="color" id="dlgColor" value="#4f46e5"></label>
    <menu>
      <button value="cancel" class="btn" formnovalidate>Cancelar</button>
      <button value="ok" class="btn primary">Salvar</button>
    </menu>
  </form>
</dialog>
<script type="module" src="js/main.js"></script>
</body>
</html>
