<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Listas por Setores</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        input[type="text"], select, input[type="number"] {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: white;
        }

        /* Tamanhos fixos baseados nos textos padrão */
        #itemName {
            flex: 2;
            min-width: 220px;
        }

        #itemSector {
            width: 195px;
            cursor: pointer;
        }

        #itemUnidade {
            width: 215px;
            cursor: pointer;
        }

        #itemQuantidade {
            width: 90px;
            text-align: center;
        }

        #itemCor {
            width: 175px;
            cursor: pointer;
        }

        #itemOutro {
            width: 175px;
            cursor: pointer;
        }

        .btn-submit {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 15px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .sector-container {
            margin-top: 30px;
            border-top: 2px solid #e5e7eb;
            padding-top: 20px;
        }

        .sector-title {
            font-size: 1.2rem;
            color: var(--primary-color);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .item-card {
            background: #fdfdfd;
            border: 1px solid #e5e7eb;
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-image {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            background: #f3f4f6;
        }

        .item-characteristics {
            font-size: 0.75rem;
            color: #4f46e5;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .item-info {
            font-size: 0.95rem;
        }

        .btn-search {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .btn-search:hover {
            background: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Minhas Listas por Setores</h1>

    <form id="itemForm">
        <!-- Linha 1: Item e Setor -->
        <div class="form-row">
            <div class="form-group">
                <label for="itemName">Nome do Item:</label>
                <input type="text" id="itemName" placeholder="Ex: Ibuprofeno, Arroz..." required>
            </div>

            <div class="form-group">
                <label for="itemSector">Setor:</label>
                <select id="itemSector" required onchange="handleSelectChange('sector', this)">
                    <option value="" disabled selected>Selecione o Setor...</option>
                </select>
            </div>
        </div>

        <!-- Linha 2: Unidade, Quantidade, Cor e Outros (Todos lado a lado) -->
        <div class="form-row">
            <div class="form-group">
                <label for="itemUnidade">Unidade / Tipo:</label>
                <select id="itemUnidade" onchange="handleSelectChange('unidade', this)">
                    <option value="" disabled selected>Selecione a Unidade...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="itemQuantidade">Qtd (Max 4):</label>
                <input type="text" id="itemQuantidade" maxlength="4" placeholder="0" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>

            <div class="form-group">
                <label for="itemCor">Cor:</label>
                <select id="itemCor" onchange="handleSelectChange('cor', this)">
                    <option value="" disabled selected>Selecione a Cor...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="itemOutro">Outro:</label>
                <select id="itemOutro" onchange="handleSelectChange('outro', this)">
                    <option value="" disabled selected>Outra opção...</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn-submit">Adicionar Item</button>
    </form>

    <div id="listsContainer"></div>
</div>

<script>
    // Dados iniciais salvos no LocalStorage
    let sectorsList = JSON.parse(localStorage.getItem('sectorsList')) || ["FARMÁCIA", "MERCADO", "ESCRITÓRIO"];
    
    let unidadesList = JSON.parse(localStorage.getItem('unidadesList')) || ["gramas", "comprimidos", "Kg.", "comprimento", "tamanho", "Lt.", "cm.", "metro(s)"];
    
    let coresList = JSON.parse(localStorage.getItem('coresList')) || ["Branco", "Preto", "Azul", "Vermelho", "Amarelo", "Verde", "Rosa", "Cinza", "Laranja", "Roxo"];
    
    let outrosList = JSON.parse(localStorage.getItem('outrosList')) || ["Padrão", "Especial"];

    let itemsList = JSON.parse(localStorage.getItem('itemsList')) || [];

    // Preenche os Selects mantendo ordem alfabética
    function populateSelect(selectId, list, defaultText, selectedVal = "") {
        const select = document.getElementById(selectId);
        select.innerHTML = `<option value="" disabled>${defaultText}</option>`;
        
        list.sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }));

        list.forEach(item => {
            const option = document.createElement('option');
            option.value = item;
            option.textContent = item;
            if (item === selectedVal) {
                option.selected = true;
            }
            select.appendChild(option);
        });

        const addOption = document.createElement('option');
        addOption.value = "__ADD_NEW__";
        addOption.textContent = "+ Adicionar...";
        select.appendChild(addOption);

        if (!selectedVal) {
            select.selectedIndex = 0;
        }
    }

    function refreshAllSelects() {
        populateSelect('itemSector', sectorsList, "Selecione o Setor...");
        populateSelect('itemUnidade', unidadesList, "Selecione a Unidade...");
        populateSelect('itemCor', coresList, "Selecione a Cor...");
        populateSelect('itemOutro', outrosList, "Outra opção...");
    }

    // Gerencia a inclusão dinâmica via prompt quando clica em "+ Adicionar..."
    function handleSelectChange(type, select) {
        if (select.value === "__ADD_NEW__") {
            const nomeTipo = type === 'sector' ? 'Setor' : type === 'unidade' ? 'Unidade' : type === 'cor' ? 'Cor' : 'Outro';
            const novo = prompt(`Digite o nome da nova ${nomeTipo}:`);
            
            if (novo && novo.trim() !== "") {
                const trimmed = novo.trim();
                const formatted = type === 'sector' ? trimmed.toUpperCase() : trimmed;
                
                let targetList = type === 'sector' ? sectorsList : type === 'unidade' ? unidadesList : type === 'cor' ? coresList : outrosList;
                let storageKey = type === 'sector' ? 'sectorsList' : type === 'unidade' ? 'unidadesList' : type === 'cor' ? 'coresList' : 'outrosList';

                if (!targetList.includes(formatted)) {
                    targetList.push(formatted);
                    localStorage.setItem(storageKey, JSON.stringify(targetList));
                    refreshAllSelects();
                    select.value = formatted; // Seleciona o recém-criado
                } else {
                    alert("Esta opção já existe!");
                    refreshAllSelects();
                }
            } else {
                refreshAllSelects();
            }
        }
    }

    // Sugestão automática de setor
    document.getElementById('itemName').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        if (val.includes('remedio') || val.includes('ibuprofeno') || val.includes('dipirona') || val.includes('comprimido')) {
            if (sectorsList.includes('FARMÁCIA')) {
                document.getElementById('itemSector').value = 'FARMÁCIA';
            }
        }
    });

    // Envio do formulário
    document.getElementById('itemForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('itemName').value.trim();
        const sector = document.getElementById('itemSector').value;
        const unidade = document.getElementById('itemUnidade').value;
        const quantidade = document.getElementById('itemQuantidade').value.trim();
        const cor = document.getElementById('itemCor').value;
        const outro = document.getElementById('itemOutro').value;

        if (!name || !sector || sector === "__ADD_NEW__") {
            alert("Por favor, preencha o nome e selecione um setor válido.");
            return;
        }

        // Monta a string de características unindo unidade, quantidade, cor e outro
        const rawCharacteristics = [
            unidade && unidade !== "__ADD_NEW__" ? unidade : "",
            quantidade ? `Qtd: ${quantidade}` : "",
            cor && cor !== "__ADD_NEW__" ? cor : "",
            outro && outro !== "__ADD_NEW__" ? outro : ""
        ];
        const characteristicsText = rawCharacteristics.filter(Boolean).join(' • ');

        // Busca imagem automática via Wikimedia
        const wikiImageUrl = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(name)}&prop=pageimages&format=json&pithumbsize=100&origin=*`;

        fetch(wikiImageUrl)
            .then(res => res.json())
            .then(data => {
                let imageUrl = "https://via.placeholder.com/45?text=Item";
                const pages = data.query && data.query.pages;
                if (pages) {
                    const pageId = Object.keys(pages)[0];
                    if (pages[pageId] && pages[pageId].thumbnail) {
                        imageUrl = pages[pageId].thumbnail.source;
                    }
                }
                saveItem(name, sector, characteristicsText, imageUrl);
            })
            .catch(() => {
                saveItem(name, sector, characteristicsText, "https://via.placeholder.com/45?text=Item");
            });
    });

    function saveItem(name, sector, characteristics, imageUrl) {
        const newItem = {
            id: Date.now(),
            name: name,
            sector: sector,
            characteristics: characteristics,
            image: imageUrl
        };

        itemsList.push(newItem);
        localStorage.setItem('itemsList', JSON.stringify(itemsList));

        // Limpa campos
        document.getElementById('itemName').value = '';
        document.getElementById('itemQuantidade').value = '';
        refreshAllSelects();
        renderItems();
    }

    function renderItems() {
        const container = document.getElementById('listsContainer');
        container.innerHTML = '';

        const sectors = {};
        itemsList.forEach(item => {
            if (!sectors[item.sector]) sectors[item.sector] = [];
            sectors[item.sector].push(item);
        });

        for (const [sectorName, items] of Object.entries(sectors)) {
            const sectorDiv = document.createElement('div');
            sectorDiv.className = 'sector-container';
            
            let html = `<div class="sector-title">${sectorName}</div>`;
            
            items.forEach(item => {
                const searchQuery = encodeURIComponent(`"${item.name}"`);
                const searchUrl = `https://www.google.com/search?q=${searchQuery}`;

                html += `
                    <div class="item-card">
                        <div class="item-left">
                            <img src="${item.image}" alt="${item.name}" class="item-image">
                            <div>
                                ${item.characteristics ? `<div class="item-characteristics">${item.characteristics}</div>` : ''}
                                <div class="item-info"><strong>${item.name}</strong></div>
                            </div>
                        </div>
                        <a href="${searchUrl}" target="_blank" class="btn-search">Buscar</a>
                    </div>
                `;
            });

            sectorDiv.innerHTML = html;
            container.appendChild(sectorDiv);
        }
    }

    // Inicialização da página
    refreshAllSelects();
    renderItems();
</script>

</body>
</html>
