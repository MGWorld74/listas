<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Listas por Setores</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: var(--primary-color);
            text-align: center;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.item-group {
            flex: 2; /* Ocupa mais espaço proporcionalmente */
        }

        .form-group.sector-group {
            flex: 1;
            min-width: 140px;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        input[type="text"], select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            width: 100%;
        }

        /* Faz o campo de setor ajustar o tamanho baseado no texto */
        #itemSector {
            width: auto;
            min-width: 120px;
        }

        .selection-section {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .selection-section h3 {
            margin-top: 0;
            font-size: 1rem;
            color: #4b5563;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .choice-btn {
            background: #e5e7eb;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .choice-btn:hover {
            background: #d1d5db;
        }

        .choice-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .add-option-btn {
            background: transparent;
            border: 2px dashed var(--primary-color);
            color: var(--primary-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .add-option-btn:hover {
            background: #e0e7ff;
        }

        .btn-submit {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .sector-container {
            margin-top: 30px;
            border-top: 2px solid #e5e7eb;
            padding-top: 20px;
        }

        .sector-title {
            font-size: 1.2rem;
            color: var(--primary-color);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .item-card {
            background: #fdfdfd;
            border: 1px solid #e5e7eb;
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .item-info {
            font-size: 0.95rem;
        }

        .item-details {
            font-size: 0.8rem;
            color: #6b7280;
        }

        .btn-search {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .btn-search:hover {
            background: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Minhas Listas por Setores</h1>

    <form id="itemForm">
        <!-- Campos Item e Setor lado a lado -->
        <div class="form-row">
            <div class="form-group item-group">
                <label for="itemName">Nome do Item:</label>
                <input type="text" id="itemName" placeholder="Ex: Ibuprofeno, Arroz, Caneta..." required>
            </div>

            <div class="form-group sector-group">
                <label for="itemSector">Setor:</label>
                <input type="text" id="itemSector" list="sectorList" placeholder="Setor..." required oninput="adjustSectorWidth(this)">
                <datalist id="sectorList">
                    <option value="FARMÁCIA">
                    <option value="MERCADO">
                    <option value="ESCRITÓRIO">
                </datalist>
            </div>
        </div>

        <!-- Grupo: Unidades de Medida -->
        <div class="selection-section">
            <h3>Unidade de Medida / Tipo</h3>
            <div class="button-group" id="group-unidades"></div>
            <button type="button" class="add-option-btn" onclick="addNewOption('unidades')">+ Adicionar Unidade</button>
        </div>

        <!-- Grupo: Cores -->
        <div class="selection-section">
            <h3>Cores</h3>
            <div class="button-group" id="group-cores"></div>
            <button type="button" class="add-option-btn" onclick="addNewOption('cores')">+ Adicionar Cor</button>
        </div>

        <!-- Grupo: Outros -->
        <div class="selection-section">
            <h3>Outros</h3>
            <div class="button-group" id="group-outros"></div>
            <button type="button" class="add-option-btn" onclick="addNewOption('outros')">+ Adicionar Outro</button>
        </div>

        <button type="submit" class="btn-submit">Adicionar Item</button>
    </form>

    <div id="listsContainer"></div>
</div>

<script>
    let optionsData = JSON.parse(localStorage.getItem('optionsData')) || {
        unidades: ["gramas", "comprimidos", "Kg.", "comprimento", "tamanho", "Lt.", "cm.", "metro(s)"],
        cores: ["Branco", "Preto", "Azul", "Vermelho"],
        outros: ["Padrão", "Especial"]
    };

    let itemsList = JSON.parse(localStorage.getItem('itemsList')) || [];

    let selectedValues = {
        unidades: "",
        cores: "",
        outros: ""
    };

    // Ajusta dinamicamente a largura do input de setor com base no texto digitado
    function adjustSectorWidth(input) {
        const text = input.value || input.placeholder;
        // Cria um elemento temporário para medir o texto
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        context.font = window.getComputedStyle(input).font;
        const width = context.measureText(text).width;
        input.style.width = Math.max(120, width + 30) + 'px';
    }

    // Sugestão automática de setor
    document.getElementById('itemName').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        const sectorInput = document.getElementById('itemSector');
        if (val.includes('remedio') || val.includes('ibuprofeno') || val.includes('dipirona') || val.includes('comprimido')) {
            sectorInput.value = 'FARMÁCIA';
            adjustSectorWidth(sectorInput);
        }
    });

    function renderButtons(category) {
        const container = document.getElementById(`group-${category}`);
        container.innerHTML = '';
        
        optionsData[category].sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }));

        optionsData[category].forEach(opt => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `choice-btn ${selectedValues[category] === opt ? 'active' : ''}`;
            btn.textContent = opt;
            btn.onclick = () => {
                if (selectedValues[category] === opt) {
                    selectedValues[category] = "";
                } else {
                    selectedValues[category] = opt;
                }
                renderButtons(category);
            };
            container.appendChild(btn);
        });
    }

    function addNewOption(category) {
        const nova = prompt(`Digite a nova opção para ${category.toUpperCase()}:`);
        if (nova && nova.trim() !== "") {
            const trimmed = nova.trim();
            if (!optionsData[category].includes(trimmed)) {
                optionsData[category].push(trimmed);
                optionsData[category].sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }));
                localStorage.setItem('optionsData', JSON.stringify(optionsData));
                renderButtons(category);
            } else {
                alert("Esta opção já existe!");
            }
        }
    }

    document.getElementById('itemForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('itemName').value.trim();
        const sectorInput = document.getElementById('itemSector');
        const sector = sectorInput.value.trim().toUpperCase();

        if (!name || !sector) return;

        const newItem = {
            id: Date.now(),
            name: name,
            sector: sector,
            unidade: selectedValues.unidades,
            cor: selectedValues.cores,
            outro: selectedValues.outros
        };

        itemsList.push(newItem);
        localStorage.setItem('itemsList', JSON.stringify(itemsList));

        document.getElementById('itemName').value = '';
        sectorInput.value = '';
        adjustSectorWidth(sectorInput);
        selectedValues = { unidades: "", cores: "", outros: "" };
        
        renderButtons('unidades');
        renderButtons('cores');
        renderButtons('outros');
        renderItems();
    });

    function renderItems() {
        const container = document.getElementById('listsContainer');
        container.innerHTML = '';

        const sectors = {};
        itemsList.forEach(item => {
            if (!sectors[item.sector]) sectors[item.sector] = [];
            sectors[item.sector].push(item);
        });

        for (const [sectorName, items] of Object.entries(sectors)) {
            const sectorDiv = document.createElement('div');
            sectorDiv.className = 'sector-container';
            
            let html = `<div class="sector-title">${sectorName}</div>`;
            
            items.forEach(item => {
                const details = [item.unidade, item.cor, item.outro].filter(Boolean).join(' | ');
                const searchQuery = encodeURIComponent(`"${item.name}"`);
                const searchUrl = `https://www.google.com/search?q=${searchQuery}`;

                html += `
                    <div class="item-card">
                        <div>
                            <div class="item-info"><strong>${item.name}</strong></div>
                            <div class="item-details">${details ? 'Detalhes: ' + details : ''}</div>
                        </div>
                        <a href="${searchUrl}" target="_blank" class="btn-search">Buscar</a>
                    </div>
                `;
            });

            sectorDiv.innerHTML = html;
            container.appendChild(sectorDiv);
        }
    }

    // Inicialização
    renderButtons('unidades');
    renderButtons('cores');
    renderButtons('outros');
    renderItems();
    adjustSectorWidth(document.getElementById('itemSector'));
</script>

</body>
</html>
