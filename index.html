<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Listas por Setores</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.item-group {
            flex: 2;
        }

        .form-group.sector-group {
            flex: 1;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        input[type="text"], select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            width: 100%;
        }

        /* Ajusta o select para o tamanho do maior texto */
        #itemSector {
            width: auto;
            min-width: 140px;
            background-color: white;
            cursor: pointer;
        }

        .selection-section {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .selection-section h3 {
            margin-top: 0;
            font-size: 1rem;
            color: #4b5563;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .choice-btn {
            background: #e5e7eb;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .choice-btn:hover {
            background: #d1d5db;
        }

        .choice-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .add-option-btn {
            background: transparent;
            border: 2px dashed var(--primary-color);
            color: var(--primary-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .add-option-btn:hover {
            background: #e0e7ff;
        }

        .btn-submit {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .sector-container {
            margin-top: 30px;
            border-top: 2px solid #e5e7eb;
            padding-top: 20px;
        }

        .sector-title {
            font-size: 1.2rem;
            color: var(--primary-color);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .item-card {
            background: #fdfdfd;
            border: 1px solid #e5e7eb;
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-image {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            background: #f3f4f6;
        }

        .item-characteristics {
            font-size: 0.75rem;
            color: #4f46e5;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .item-info {
            font-size: 0.95rem;
        }

        .btn-search {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .btn-search:hover {
            background: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Minhas Listas por Setores</h1>

    <form id="itemForm">
        <div class="form-row">
            <div class="form-group item-group">
                <label for="itemName">Nome do Item:</label>
                <input type="text" id="itemName" placeholder="Ex: Ibuprofeno, Arroz, Caneta..." required>
            </div>

            <div class="form-group sector-group">
                <label for="itemSector">Setor:</label>
                <select id="itemSector" required onchange="handleSectorChange(this)">
                    <option value="" disabled selected>Selecione...</option>
                    <!-- Opções geradas via JS -->
                </select>
            </div>
        </div>

        <!-- Grupo: Unidades de Medida -->
        <div class="selection-section">
            <h3>Unidade de Medida / Tipo</h3>
            <div class="button-group" id="group-unidades"></div>
            <button type="button" class="add-option-btn" onclick="addNewOption('unidades')">+ Adicionar Unidade</button>
        </div>

        <!-- Grupo: Cores -->
        <div class="selection-section">
            <h3>Cores</h3>
            <div class="button-group" id="group-cores"></div>
            <button type="button" class="add-option-btn" onclick="addNewOption('cores')">+ Adicionar Cor</button>
        </div>

        <!-- Grupo: Outros -->
        <div class="selection-section">
            <h3>Outros</h3>
            <div class="button-group" id="group-outros"></div>
            <button type="button" class="add-option-btn" onclick="addNewOption('outros')">+ Adicionar Outro</button>
        </div>

        <button type="submit" class="btn-submit">Adicionar Item</button>
    </form>

    <div id="listsContainer"></div>
</div>

<script>
    let optionsData = JSON.parse(localStorage.getItem('optionsData')) || {
        unidades: ["gramas", "comprimidos", "Kg.", "comprimento", "tamanho", "Lt.", "cm.", "metro(s)"],
        cores: ["Branco", "Preto", "Azul", "Vermelho"],
        outros: ["Padrão", "Especial"]
    };

    let sectorsList = JSON.parse(localStorage.getItem('sectorsList')) || ["FARMÁCIA", "MERCADO", "ESCRITÓRIO"];
    let itemsList = JSON.parse(localStorage.getItem('itemsList')) || [];

    let selectedValues = {
        unidades: "",
        cores: "",
        outros: ""
    };

    // Ajusta a largura do select para o tamanho do texto selecionado
    function adjustSelectWidth(selectElement) {
        const selectedOption = selectElement.options[selectElement.selectedIndex];
        if (selectedOption && selectedOption.value) {
            const text = selectedOption.text;
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            context.font = window.getComputedStyle(selectElement).font;
            const width = context.measureText(text).width;
            selectElement.style.width = Math.max(140, width + 50) + 'px';
        }
    }

    // Renderiza as opções do select de setores em ordem alfabética + a opção de adicionar
    function renderSectorsSelect(selectedVal = "") {
        const select = document.getElementById('itemSector');
        select.innerHTML = '<option value="" disabled>Selecione o Setor...</option>';
        
        sectorsList.sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }));

        sectorsList.forEach(sector => {
            const option = document.createElement('option');
            option.value = sector;
            option.textContent = sector;
            if (sector === selectedVal) {
                option.selected = true;
            }
            select.appendChild(option);
        });

        // Opção especial dentro da lista para adicionar novo setor
        const addOption = document.createElement('option');
        addOption.value = "__ADD_NEW__";
        addOption.textContent = "+ Adicionar Setor...";
        select.appendChild(addOption);

        if (!selectedVal) {
            select.selectedIndex = 0;
        }
        adjustSelectWidth(select);
    }

    // Controla quando o usuário clica na opção de adicionar dentro do select
    function handleSectorChange(select) {
        if (select.value === "__ADD_NEW__") {
            const novo = prompt("Digite o nome do novo Setor:");
            if (novo && novo.trim() !== "") {
                const trimmed = novo.trim().toUpperCase();
                if (!sectorsList.includes(trimmed)) {
                    sectorsList.push(trimmed);
                    localStorage.setItem('sectorsList', JSON.stringify(sectorsList));
                    renderSectorsSelect(trimmed); // Seleciona automaticamente o novo setor
                } else {
                    alert("Este setor já existe!");
                    renderSectorsSelect();
                }
            } else {
                renderSectorsSelect();
            }
        } else {
            adjustSelectWidth(select);
        }
    }

    // Sugestão automática de setor baseada no nome do item
    document.getElementById('itemName').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        if (val.includes('remedio') || val.includes('ibuprofeno') || val.includes('dipirona') || val.includes('comprimido')) {
            if (sectorsList.includes('FARMÁCIA')) {
                renderSectorsSelect('FARMÁCIA');
            }
        }
    });

    function renderButtons(category) {
        const container = document.getElementById(`group-${category}`);
        container.innerHTML = '';
        optionsData[category].sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }));
        optionsData[category].forEach(opt => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `choice-btn ${selectedValues[category] === opt ? 'active' : ''}`;
            btn.textContent = opt;
            btn.onclick = () => {
                if (selectedValues[category] === opt) {
                    selectedValues[category] = "";
                } else {
                    selectedValues[category] = opt;
                }
                renderButtons(category);
            };
            container.appendChild(btn);
        });
    }

    function addNewOption(category) {
        const nova = prompt(`Digite a nova opção para ${category.toUpperCase()}:`);
        if (nova && nova.trim() !== "") {
            const trimmed = nova.trim();
            if (!optionsData[category].includes(trimmed)) {
                optionsData[category].push(trimmed);
                optionsData[category].sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }));
                localStorage.setItem('optionsData', JSON.stringify(optionsData));
                renderButtons(category);
            } else {
                alert("Esta opção já existe!");
            }
        }
    }

    document.getElementById('itemForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('itemName').value.trim();
        const select = document.getElementById('itemSector');
        const sector = select.value;

        if (!name || !sector || sector === "__ADD_NEW__") {
            alert("Por favor, selecione um setor válido.");
            return;
        }

        const wikiImageUrl = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(name)}&prop=pageimages&format=json&pithumbsize=100&origin=*`;

        fetch(wikiImageUrl)
            .then(res => res.json())
            .then(data => {
                let imageUrl = "https://via.placeholder.com/45?text=Item";
                const pages = data.query && data.query.pages;
                if (pages) {
                    const pageId = Object.keys(pages)[0];
                    if (pages[pageId] && pages[pageId].thumbnail) {
                        imageUrl = pages[pageId].thumbnail.source;
                    }
                }
                saveItemWithImage(name, sector, imageUrl);
            })
            .catch(() => {
                saveItemWithImage(name, sector, "https://via.placeholder.com/45?text=Item");
            });
    });

    function saveItemWithImage(name, sector, imageUrl) {
        const newItem = {
            id: Date.now(),
            name: name,
            sector: sector,
            unidade: selectedValues.unidades,
            cor: selectedValues.cores,
            outro: selectedValues.outros,
            image: imageUrl
        };

        itemsList.push(newItem);
        localStorage.setItem('itemsList', JSON.stringify(itemsList));

        document.getElementById('itemName').value = '';
        renderSectorsSelect();
        selectedValues = { unidades: "", cores: "", outros: "" };
        
        renderButtons('unidades');
        renderButtons('cores');
        renderButtons('outros');
        renderItems();
    }

    function renderItems() {
        const container = document.getElementById('listsContainer');
        container.innerHTML = '';

        const sectors = {};
        itemsList.forEach(item => {
            if (!sectors[item.sector]) sectors[item.sector] = [];
            sectors[item.sector].push(item);
        });

        for (const [sectorName, items] of Object.entries(sectors)) {
            const sectorDiv = document.createElement('div');
            sectorDiv.className = 'sector-container';
            
            let html = `<div class="sector-title">${sectorName}</div>`;
            
            items.forEach(item => {
                const characteristics = [item.unidade, item.cor, item.outro].filter(Boolean).join(' • ');
                const searchQuery = encodeURIComponent(`"${item.name}"`);
                const searchUrl = `https://www.google.com/search?q=${searchQuery}`;

                html += `
                    <div class="item-card">
                        <div class="item-left">
                            <img src="${item.image}" alt="${item.name}" class="item-image">
                            <div>
                                ${characteristics ? `<div class="item-characteristics">${characteristics}</div>` : ''}
                                <div class="item-info"><strong>${item.name}</strong></div>
                            </div>
                        </div>
                        <a href="${searchUrl}" target="_blank" class="btn-search">Buscar</a>
                    </div>
                `;
            });

            sectorDiv.innerHTML = html;
            container.appendChild(sectorDiv);
        }
    }

    // Inicialização
    renderSectorsSelect();
    renderButtons('unidades');
    renderButtons('cores');
    renderButtons('outros');
    renderItems();
</script>

</body>
</html>
